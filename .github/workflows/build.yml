name: Build

on:
  push:
  pull_request:
  # Run the workflow manually
  workflow_dispatch:
  # Run the workflow on a nightly schedule
  schedule:
    - cron: "0 0 * * *"

# Set a new GitHub Actions Secret named IAR_LMS_BEARER_TOKEN
# for your repository. The secret is then securely forwarded
# to an environment variable consumed by this workflow.
env:
  IAR_LMS_BEARER_TOKEN: ${{ secrets.IAR_LMS_BEARER_TOKEN }}

permissions:
  contents: read

jobs:
  build:
    name: Build app and tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zephyr-example-application
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zephyr-example-application
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ${{ matrix.os }}

      - name: Setup IAR Build Tools for Arm
        working-directory: zephyr-example-application
        shell: bash
        run: |
          wget https://github.com/iarsystems/arm/releases/download/10.10.2/cxarm-10.10.2-linux-x86_64-minimal.tar.bz2
          tar -xf cxarm-10.10.2-linux-x86_64-minimal.tar.bz2
          echo "ZEPHYR_TOOLCHAIN_VARIANT=iar" >> $GITHUB_ENV
          echo "IAR_TOOLCHAIN_PATH=$PWD/cxarm-10.10.2/arm" >> $GITHUB_ENV
          echo "EXTRA_TWISTER_FLAGS=-W" >> $GITHUB_ENV

      - name: Build firmware
        working-directory: zephyr-example-application
        shell: bash
        run: |
          west twister -T app -v --inline-logs --integration $EXTRA_TWISTER_FLAGS

      - name: Twister Tests
        working-directory: zephyr-example-application
        shell: bash
        run: |
          west twister -T tests -v --inline-logs --integration $EXTRA_TWISTER_FLAGS
